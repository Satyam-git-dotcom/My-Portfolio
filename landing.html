<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Portfolio OS — Booting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    --paper:#f4f1ea; --card:#fff; --subtle:#ebe6dc; --ink:#111; --muted:#666;
    --red:#dc2626; --blue:#1d4ed8; --yellow:#eab308;
    --out:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.56,.64,1);
    --mono:"JetBrains Mono",ui-monospace,monospace; --disp:"Space Grotesk",system-ui,sans-serif; --sans:"Plus Jakarta Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;overscroll-behavior:none}
  body{background-image:linear-gradient(to right,rgba(17,17,17,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(17,17,17,.05) 1px,transparent 1px);background-size:32px 32px}
  ::selection{background:var(--red);color:#fff}
  :focus-visible{outline:3px solid var(--blue);outline-offset:2px}

  /* ---- top bar (same as portfolio) ---- */
  .bar{position:fixed;inset:0 0 auto 0;height:44px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;
    background:rgba(244,241,234,.95);border-bottom:1px solid var(--ink);font:500 12px var(--mono);z-index:5;animation:down .6s var(--out) backwards}
  .brand{display:flex;align-items:center;gap:8px;font:700 12px var(--disp);letter-spacing:.06em;text-transform:uppercase}
  .brand i{width:12px;height:12px;background:var(--red);display:block}
  .stat{display:flex;gap:14px;color:rgba(17,17,17,.7)}
  .stat b{color:var(--ink)}
  .chip{display:flex;gap:6px;align-items:center;border:1px solid var(--ink);background:var(--card);padding:2px 8px;box-shadow:1px 1px 0 var(--ink);font-weight:700}
  .chip i{width:6px;height:6px;border-radius:50%;background:var(--red);animation:blink 1.1s steps(2) infinite}

  /* ---- stage ---- */
  main{position:fixed;inset:0;display:grid;place-items:center;padding:64px 16px 24px}
  .shape{position:absolute;border:4px solid var(--ink);animation:shapeIn 1s var(--out) backwards}
  .s1{width:clamp(150px,24vw,300px);aspect-ratio:1;border-radius:50%;background:var(--yellow);left:max(2vw,calc(50% - 480px));top:12vh;animation-delay:.25s}
  .s2{width:clamp(110px,16vw,200px);aspect-ratio:1;background:var(--red);right:max(2vw,calc(50% - 470px));top:9vh;animation-delay:.4s}
  .s3{width:clamp(120px,18vw,220px);aspect-ratio:1;background:var(--blue);border-radius:100% 0 0 0;right:max(3vw,calc(50% - 430px));bottom:8vh;animation-delay:.55s}

  /* ---- window ---- */
  .win{position:relative;width:min(640px,100%);background:var(--card);border:2px solid var(--ink);box-shadow:10px 10px 0 var(--ink);display:flex;flex-direction:column;
    animation:winIn .7s .15s var(--out) backwards;transition:opacity .35s,scale .35s var(--out)}
  .win.leaving{opacity:0;scale:.95}
  .chrome{height:40px;padding:0 14px;background:var(--paper);border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:14px;font:700 12px var(--mono);letter-spacing:.04em}
  .dots{display:flex;gap:8px}.dots i{width:14px;height:14px;border:1px solid var(--ink);display:block}
  .dots i:nth-child(1){background:var(--red)}.dots i:nth-child(2){background:var(--yellow)}.dots i:nth-child(3){background:var(--blue)}
  .chrome span:last-child{margin-left:auto;color:var(--muted);font-weight:500}
  .body{padding:20px;font:400 13px/1.75 var(--mono);min-height:272px;background:var(--paper)}
  #log{white-space:pre-wrap;min-height:138px}
  #log .ok{color:var(--blue);font-weight:700}#log .warn{color:var(--red);font-weight:700}#log .head{font-weight:700}
  .cur{display:inline-block;width:8px;height:15px;background:var(--ink);vertical-align:-2px;animation:blink 1s steps(2) infinite}
  .meter{display:flex;gap:3px;margin-top:14px}
  .meter i{flex:1;height:10px;border:1px solid var(--ink);background:var(--card);transition:background .12s}
  .meter i.on{background:var(--ink)}.meter i.on:nth-child(3n){background:var(--red)}
  .foot{height:30px;padding:0 14px;border-top:1px solid var(--ink);display:flex;align-items:center;justify-content:space-between;font:500 11px var(--mono);color:var(--muted);background:var(--card)}
  .foot button{font:700 11px var(--mono);background:none;border:none;color:var(--ink);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  /* ---- name prompt ---- */
  #ask{display:none;border-top:2px dashed var(--ink);margin-top:16px;padding-top:16px}
  #ask.show{display:block;animation:rise .55s var(--out) backwards}
  #ask h1{font:700 24px/1.15 var(--disp);letter-spacing:-.01em;margin-bottom:4px}
  #ask p{font:400 12px/1.5 var(--mono);color:var(--muted);margin-bottom:12px}
  .row{display:flex;gap:8px}
  #name{flex:1;min-width:0;height:44px;padding:0 12px;border:2px solid var(--ink);background:#fff;font:600 15px var(--sans);color:var(--ink);border-radius:0;transition:border-color .2s,box-shadow .2s}
  #name:focus{outline:none;border-color:var(--red);box-shadow:4px 4px 0 var(--ink)}
  .go{height:44px;padding:0 16px;background:var(--ink);color:var(--paper);border:2px solid var(--ink);font:700 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;box-shadow:3px 3px 0 var(--ink);
    transition:background .2s,translate .2s var(--spring),box-shadow .2s}
  .go:hover{background:var(--red);translate:-1px -1px;box-shadow:5px 5px 0 var(--ink)}
  .go:active{translate:2px 2px;box-shadow:0 0 0 var(--ink)}
  .alt{margin-top:10px;display:flex;justify-content:space-between;align-items:center;font:500 11px var(--mono)}
  .alt button{background:none;border:none;font:700 11px var(--mono);color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  #err{color:var(--red);font-weight:700;min-height:16px}
  .shake{animation:shake .4s}

  /* ---- exit curtain: four Bauhaus panels sweep up, then a welcome ---- */
  #curtain{position:fixed;inset:0;display:none;z-index:20;pointer-events:none}
  #curtain.on{display:flex}
  #curtain i{flex:1;transform-origin:bottom;scale:1 0;animation:sweep .7s var(--out) forwards;animation-delay:calc(var(--n)*90ms);border-right:2px solid var(--ink)}
  #curtain i:nth-child(1){background:var(--red);--n:0}#curtain i:nth-child(2){background:var(--yellow);--n:1}
  #curtain i:nth-child(3){background:var(--blue);--n:2}#curtain i:nth-child(4){background:var(--ink);--n:3;border:none}
  #welcome{position:fixed;inset:0;z-index:30;display:none;place-items:center;text-align:center;color:var(--paper);padding:24px}
  #welcome.on{display:grid;animation:fade .5s .55s backwards}
  #welcome h2{font:700 clamp(32px,7vw,72px)/1.05 var(--disp);letter-spacing:-.02em;overflow-wrap:anywhere}
  #welcome p{margin-top:14px;font:500 13px var(--mono);color:rgba(244,241,234,.7)}
  #welcome .line{width:min(280px,60vw);height:6px;margin:18px auto 0;border:1px solid var(--paper);overflow:hidden}
  #welcome .line b{display:block;height:100%;background:var(--yellow);scale:0 1;transform-origin:left;animation:load 1.3s .7s linear forwards}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  @keyframes down{from{translate:0 -100%;opacity:0}}
  @keyframes winIn{from{opacity:0;translate:0 18px;scale:.97}}
  @keyframes shapeIn{from{opacity:0;scale:.6;rotate:-12deg}}
  @keyframes rise{from{opacity:0;translate:0 12px}}
  @keyframes blink{50%{opacity:0}}
  @keyframes shake{20%,60%{translate:-6px 0}40%,80%{translate:6px 0}}
  @keyframes sweep{to{scale:1 1}}
  @keyframes fade{from{opacity:0}}
  @keyframes load{to{scale:1 1}}

  @media (max-width:560px){.stat span:not(:first-child){display:none}.row{flex-direction:column}.go{width:100%}.body{padding:16px}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
  <header class="bar">
    <div class="brand"><i></i>Portfolio OS // Satyam-01</div>
    <div class="stat"><span>SYS: <b id="sys">BOOTING</b></span><span>PWR: <b>100%</b></span><span class="chip"><i></i>NEW VISITOR</span></div>
  </header>

  <main>
    <div class="shape s1"></div><div class="shape s2"></div><div class="shape s3"></div>

    <section class="win" id="win" aria-label="Boot sequence">
      <div class="chrome"><div class="dots"><i></i><i></i><i></i></div><span>BOOT.SYS</span><span>PID: 0x0001</span></div>
      <div class="body">
        <div id="log" aria-hidden="true"></div>
        <div class="meter" id="meter" aria-hidden="true"></div>

        <form id="ask" autocomplete="on" novalidate>
          <h1>What should I call you?</h1>
          <p>Your name stays in this browser and is only used to greet you.</p>
          <div class="row">
            <input id="name" name="name" type="text" maxlength="24" autocomplete="given-name" placeholder="Type your name" aria-label="Your name" aria-describedby="err"/>
            <button class="go" type="submit">Enter system</button>
          </div>
          <div class="alt"><span id="err" role="alert"></span><button type="button" id="guest">Continue as guest</button></div>
        </form>
      </div>
      <div class="foot"><span id="pct">0%</span><button type="button" id="skip">Skip boot</button></div>
    </section>
    <p class="sr" role="status" id="live"></p>
  </main>

  <div id="curtain" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div id="welcome" aria-live="polite"><div><h2 id="hello"></h2><p>Loading your workspace</p><div class="line"><b></b></div></div></div>

<script>
(() => {
  // ---- settings ----
  const NEXT_URL = './index.html';
  const KEY = 'portfolio_visitor_name';

  const $ = s => document.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let skipped = false, ready = false;
  const sleep = ms => (skipped || reduce) ? Promise.resolve() : new Promise(r => setTimeout(r, ms));

  const LINES = [
    ['PORTFOLIO OS // ARCHITECTURAL KERNEL v2.4', '', 'head'],
    ['Loading 32px baseline grid', 'OK', 'ok'],
    ['Mounting windows: chat, about, skills, projects', 'OK', 'ok'],
    ['Waking AI twin copilot', 'OK', 'ok'],
    ['Attaching dock & sensory event buses', 'OK', 'ok'],
    ['New visitor detected', 'ID?', 'warn']
  ];
  const meter = $('#meter');
  for (let i = 0; i < 24; i++) meter.appendChild(document.createElement('i'));
  const cells = [...meter.children];
  const setProgress = p => {
    const n = Math.round(p * cells.length);
    cells.forEach((c, i) => c.classList.toggle('on', i < n));
    $('#pct').textContent = Math.round(p * 100) + '%';
  };

  async function boot() {
    const log = $('#log'), cur = document.createElement('span');
    cur.className = 'cur';
    await sleep(400);
    for (let i = 0; i < LINES.length; i++) {
      const [text, tag, cls] = LINES[i];
      const row = document.createElement('div');
      log.appendChild(row); row.appendChild(cur);
      if (cls === 'head') row.classList.add('head');
      for (const ch of text) {
        if (skipped) { row.textContent = text; break; }
        cur.before(document.createTextNode(ch));
        await sleep(12);
      }
      if (tag) {
        const t = document.createElement('span');
        t.className = cls; t.textContent = '  [ ' + tag + ' ]';
        row.textContent = text; row.appendChild(t);
      }
      setProgress((i + 1) / LINES.length);
      await sleep(i === 0 ? 240 : 150);
    }
    cur.remove();
    finishBoot();
  }

  function finishBoot() {
    if (ready) return; ready = true; skipped = true;
    $('#log').innerHTML = '';
    LINES.forEach(([text, tag, cls]) => {
      const row = document.createElement('div'); row.textContent = text;
      if (cls === 'head') row.className = 'head';
      if (tag) { const t = document.createElement('span'); t.className = cls; t.textContent = '  [ ' + tag + ' ]'; row.appendChild(t); }
      $('#log').appendChild(row);
    });
    setProgress(1);
    $('#sys').textContent = 'AWAITING ID';
    $('#skip').hidden = true;
    $('#live').textContent = 'Boot complete. Enter your name to continue.';
    const ask = $('#ask'); ask.classList.add('show');
    let saved = ''; try { saved = localStorage.getItem(KEY) || ''; } catch (e) {}
    if (saved && saved !== 'Guest') $('#name').value = saved;
    setTimeout(() => $('#name').focus(), 60);
    const l = document.createElement('link'); l.rel = 'prefetch'; l.href = NEXT_URL; document.head.appendChild(l);
  }

  const clean = v => v.replace(/[^\p{L}\p{M}\s.'-]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 24);

  function enter(name) {
    if (document.body.dataset.leaving) return;
    document.body.dataset.leaving = '1';
    try { localStorage.setItem(KEY, name); sessionStorage.setItem(KEY, name); } catch (e) {}
    $('#hello').textContent = 'Welcome, ' + name + '.';
    $('#sys').textContent = 'ONLINE';
    $('#win').classList.add('leaving');
    $('#curtain').classList.add('on');
    $('#welcome').classList.add('on');
    setTimeout(() => {
      location.href = NEXT_URL + '?visitor=' + encodeURIComponent(name);
    }, reduce ? 300 : 1800);
  }

  $('#ask').addEventListener('submit', e => {
    e.preventDefault();
    const name = clean($('#name').value);
    if (!name) {
      $('#err').textContent = 'Type a name, or continue as guest.';
      const el = $('#name'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); el.focus();
      return;
    }
    enter(name);
  });
  $('#name').addEventListener('input', () => { $('#err').textContent = ''; });
  $('#guest').addEventListener('click', () => enter('Guest'));
  $('#skip').addEventListener('click', finishBoot);
  addEventListener('keydown', e => { if (!ready && (e.key === 'Escape' || e.key === 'Enter')) finishBoot(); });

  // coming back with browser's back button: reset exit animation
  addEventListener('pageshow', e => {
    if (e.persisted) {
      delete document.body.dataset.leaving;
      ['#curtain', '#welcome'].forEach(s => $(s).classList.remove('on'));
      $('#win').classList.remove('leaving'); $('#sys').textContent = 'AWAITING ID'; $('#name').focus();
    }
  });

  boot();
})();
</script>
</body>
</html>
